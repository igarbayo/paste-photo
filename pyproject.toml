[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paste-photo"
dynamic = ["version"]
description = "Automatically paste your screenshots into Claude (Claude Code and claude.ai)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "igarbayo" }]
keywords = ["claude", "claude-code", "screenshot", "clipboard", "productivity", "tray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "psutil>=5.9",
    "pystray>=0.19",
    "tomlkit>=0.12",
    "pywin32>=306; sys_platform == 'win32'",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "jeepney>=0.8; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "packaging>=23"]
build = ["pyinstaller>=6.10", "packaging>=23"]

[project.scripts]
paste-photo = "paste_photo.__main__:main"
paste-photo-native-host = "paste_photo.bridge.native_host:main"

[project.gui-scripts]
paste-photo-gui = "paste_photo.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "paste_photo.__version__" }

[tool.setuptools.packages.find]
include = ["paste_photo*"]

[tool.setuptools.package-data]
paste_photo = [
    "resources/*.toml",
    "resources/*.png",
    "resources/*.ico",
    "resources/extension/*",
    "resources/gnome_extension/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
