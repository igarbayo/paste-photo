# CI: lint y tests en Windows, macOS y Linux, integración real en Linux y macOS, y
# construcción del .exe, del .deb y del .app/.dmg de macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  linux-integration:
    name: Linux X11 (Xvfb + terminales reales)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Escritorio X11 virtual y terminales
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb openbox xterm tmux xclip x11-utils
      - run: python -m pip install -e ".[dev]"
      - name: Capturas reales → tmux y xterm (Ctrl+V en un Claude falso)
        run: PASTE_PHOTO_INTEGRATION=1 pytest -q tests/integration

  macos-integration:
    name: macOS (portapapeles, carpeta de capturas, tmux, AppleScript)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: brew install tmux
      - run: python -m pip install -e ".[dev]"
      - name: Capturas reales → tmux (Ctrl+V en un Claude falso) y AppleScripts compilados
        run: PASTE_PHOTO_INTEGRATION=1 pytest -q -rs tests/integration
      - name: Prueba de humo de la CLI
        run: |
          paste-photo --version
          paste-photo --list-targets
          paste-photo doctor

  build-deb:
    name: Build .deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pystray
      - run: python packaging/linux/build_deb.py
      - name: Instalar con apt y arrancar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/paste-photo_*_all.deb
          paste-photo --version
          paste-photo --list-targets
      - uses: actions/upload-artifact@v6
        with:
          name: paste-photo-deb
          path: dist/*.deb
          retention-days: 7

  build-windows:
    name: Build .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[build]"
      - name: Build (incluye prueba de humo del .exe)
        run: python packaging/build.py
      - uses: actions/upload-artifact@v6
        with:
          name: paste-photo-windows
          path: dist/paste-photo
          retention-days: 7

  build-macos:
    name: Build .app y .dmg
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[build]"
      - name: Build (incluye prueba de humo de la app)
        run: python packaging/build.py --dmg
      - name: Abrir la app como con doble clic (Finder) y comprobar que sigue viva
        run: |
          open dist/PastePhoto.app
          sleep 10
          pgrep -fl "PastePhoto.app/Contents/MacOS/paste-photo" || {
            cat ~/Library/Logs/paste-photo/*.log 2>/dev/null; exit 1; }
          cat ~/Library/Logs/paste-photo/*.log 2>/dev/null || true
          pkill -f "PastePhoto.app/Contents/MacOS/paste-photo"
      - uses: actions/upload-artifact@v6
        with:
          name: paste-photo-macos
          path: dist/*.dmg
          retention-days: 7
