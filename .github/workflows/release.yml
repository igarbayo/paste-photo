# Release: al subir un tag vX.Y.Z se construyen el instalador de Windows, el .deb de Linux y
# el zip de la extensión del navegador, se generan los manifiestos de winget y se publica
# una release de GitHub con todo.
#
# Envío automático a winget (microsoft/winget-pkgs), opcional:
#   - el repo debe ser público (winget descarga el instalador sin autenticación);
#   - variable del repo WINGET_SUBMIT=true y secreto WINGET_TOKEN (PAT clásico con public_repo).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Comprobar que el tag coincide con __version__
        run: |
          version=$(python packaging/build.py --version)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag distinto de __version__"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: python -m pip install pystray
      - name: .deb (se instala con apt para comprobarlo)
        run: |
          python packaging/linux/build_deb.py
          sudo apt-get update -qq && sudo apt-get install -y -qq ./dist/paste-photo_*_all.deb
          paste-photo --version
      - name: Zip de la extensión del navegador
        run: (cd paste_photo/resources/extension && zip -qr "$GITHUB_WORKSPACE/dist/paste-photo-extension-$VERSION.zip" .)
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.zip

  release:
    needs: linux
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Comprobar que el tag coincide con __version__
        id: version
        shell: bash
        run: |
          version=$(python packaging/build.py --version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con __version__ ($version)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: python -m pip install -e ".[dev,build]"
      - run: pytest -q

      - name: Instalar Inno Setup si no está
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Construir .exe e instalador
        run: python packaging/build.py --installer

      - name: Manifiestos de winget
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          installer="dist/paste-photo-setup-$VERSION.exe"
          sha=$(sha256sum "$installer" | cut -d' ' -f1)
          echo "$sha  paste-photo-setup-$VERSION.exe" > "dist/paste-photo-setup-$VERSION.exe.sha256"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/paste-photo-setup-$VERSION.exe"
          python packaging/winget/make_manifests.py --version "$VERSION" --url "$url" --sha256 "$sha" --out dist/winget
          (cd dist/winget && 7z a "../winget-manifests-$VERSION.zip" manifests > /dev/null)

      - name: Validar manifiestos de winget
        shell: pwsh
        continue-on-error: true  # winget no siempre está disponible en los runners
        run: winget validate --manifest "dist/winget/manifests/i/igarbayo/paste-photo/${{ steps.version.outputs.version }}"

      - uses: actions/download-artifact@v5
        with:
          name: linux
          path: dist

      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python packaging/release_notes.py "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/paste-photo-setup-$VERSION.exe" \
            "dist/paste-photo-setup-$VERSION.exe.sha256" \
            "dist/winget-manifests-$VERSION.zip" \
            "dist/paste-photo_${VERSION}_all.deb" \
            "dist/paste-photo-extension-$VERSION.zip" \
            --title "paste-photo $VERSION" --notes-file notes.md

  winget:
    needs: release
    if: ${{ vars.WINGET_SUBMIT == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Enviar a microsoft/winget-pkgs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Output "::error::El secreto WINGET_TOKEN está vacío. Guárdalo en Settings > Secrets and variables > Actions y relanza este job."
            exit 1
          }
          gh release download "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --pattern "winget-manifests-*.zip"
          Expand-Archive "winget-manifests-$env:VERSION.zip" -DestinationPath winget
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN "winget\manifests\i\igarbayo\paste-photo\$env:VERSION"
