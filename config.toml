# Configuración de paste-photo.
# Se busca en este orden: --config RUTA, ./config.toml, %APPDATA%\paste-photo\config.toml
# (macOS: ~/Library/Application Support/paste-photo, Linux: ~/.config/paste-photo).

[general]
# Ignora la misma imagen si vuelve a llegar antes de este tiempo (Win+Shift+S
# puede notificar varias veces la misma captura).
debounce_ms = 2000
# Tras pegar, devuelve el foco a la ventana en la que estabas.
restore_focus = true

# Destinos, en orden de prioridad: se pega en el primero que encuentre Claude Code.
# Tipos disponibles: `python -m paste_photo --list-targets`

[[targets]]
type = "windows_terminal"
# Regex sobre el título de la pestaña. Claude Code lo prefija con ✳ (en reposo)
# o ◐◓◑◒ (trabajando). Para una pestaña concreta, p. ej.: "mi-proyecto"
title_regex = "^[✳✻✽✶✢·◐◓◑◒]\\s|Claude Code"
# Ctrl+V en Windows Terminal solo pega texto; Claude Code usa Alt+V para imágenes.
paste_keys = "alt+v"
# Espera (ms) tras enfocar antes de enviar teclas.
settle_ms = 150
# Vuelve a la pestaña que tenías seleccionada en esa ventana.
restore_tab = true

# Cualquier chat de Claude en la web (claude.ai: Chat, Code, Design...).
[[targets]]
type = "browser"
# Navegadores (nombre del proceso). Soportados: los basados en Chromium.
browsers = ["chrome.exe", "msedge.exe", "brave.exe", "vivaldi.exe", "opera.exe"]
# Coincidencia fuerte: URL de la pestaña visible de cada ventana.
url_regex = "^(?:https?://)?(?:[\\w-]+\\.)*claude\\.ai(?:[/?#]|$)"
# Coincidencia débil (pestañas en segundo plano): "... - Claude", "Claude Code"...
title_regex = "(?:^|\\s)Claude(?:\\s(?:Code|Design))?(?=$|[:(]|\\s[-–|]\\s|\\s\\()"
# Solo se pega si la pestaña tiene el prompt (editor con esta clase CSS); si no, se
# prueba la siguiente candidata.
editor_class = "ProseMirror"
paste_keys = "ctrl+v"
settle_ms = 250
restore_tab = true

